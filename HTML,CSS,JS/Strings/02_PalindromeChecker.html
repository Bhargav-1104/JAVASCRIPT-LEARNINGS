<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palindrome Checker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        /* color-scheme: light dark; */
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .template {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      input,
      button {
        padding: 10px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="template">
      <h1>Check if the given word is Palinkdrome or not!!</h1>
      <input type="text" placeholder="Enter the word" id="word" />
      <p id="result"></p>
      <button onclick="PalindromeChecker()">CHECK</button>
      <script>
        const word = document.getElementById("word");
        const result = document.getElementById("result");

        function PalindromeChecker() {
          const text = word.value.trim().toLowerCase();

          const len = text.length;

          for (let i = 0; i < len / 2; i++) {
            if (text.charAt(i) != text.charAt(len - i - 1)) {
              result.textContent = `NO!!`;
              return;
            }
          }
          result.textContent = `YES!!`;
        }
      </script>
    </div>
  </body>
</html>
