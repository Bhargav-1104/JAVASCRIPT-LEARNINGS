<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Checker</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        /* color-scheme: light dark; */
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .template {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      input,
      button {
        padding: 10px;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div class="template">
      <h1>Check the strength of your Password!!</h1>
      <input type="text" placeholder="Enter Your Password" id="word" />
      <p id="eightCheck"></p>
      <p id="upperCaseCheck"></p>
      <p id="numberCheck"></p>
      <p id="lowerCaseCheck"></p>
      <p id="symbolCheck"></p>
      <button onclick="PasswordChecker()">CHECK</button>
      <script>
        const word = document.getElementById("word");
        const eightCheck = document.getElementById("eightCheck");
        const upperCaseCheck = document.getElementById("upperCaseCheck");
        const numberCheck = document.getElementById("numberCheck");
        const lowerCaseCheck = document.getElementById("lowerCaseCheck");
        const symbolCheck = document.getElementById("symbolCheck");

        function PasswordChecker() {
          const text = word.value.trim();

          let up = false;
          let low = false;
          let num = false;
          let sym = false;

          for (const char of text) {
            if (char >= "a" && char <= "z") {
              low = true;
            } else if (char >= "A" && char <= "Z") {
              up = true;
            } else if (char >= "0" && char <= "9") {
              num = true;
            } else if (
              (char >= " " && char <= "/") ||
              (char >= ":" && char <= "@") ||
              (char >= "[" && char <= "`") ||
              (char >= "{" && char <= "~")
            ) {
              sym = true;
            }
          }

          if (low && up && num && sym && text.length >= 8) {
            eightCheck.textContent = `8 Characters: ✔ `;
          } else {
            eightCheck.textContent = `8 Characters: ✖ `;
          }
          if (low) {
            lowerCaseCheck.textContent = `Contains Lower case:  ✔`;
          } else {
            lowerCaseCheck.textContent = `Contains Lower Case:  ✖`;
          }
          if (up) {
            upperCaseCheck.textContent = `Contains Uppercase:  ✔`;
          } else {
            upperCaseCheck.textContent = `Contains Uppercase:  ✖`;
          }
          if (num) {
            numberCheck.textContent = `Contains Number: ✔`;
          } else {
            numberCheck.textContent = `Contains Number: ✖`;
          }

          if (sym) {
            symbolCheck.textContent = `Contains Symbol: ✔`;
          } else {
            symbolCheck.textContent = `Contains Symbol: ✖`;
          }
        }
      </script>
    </div>
    <script></script>
  </body>
</html>
